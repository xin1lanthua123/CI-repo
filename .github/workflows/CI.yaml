name: Microservices-CI

on:
  workflow_dispatch:
    inputs:
        action:
            description: "action"
            required: true
            default: "apply"
            type: choice
            options:
            - apply
  pull_request:
    branches: [dev, main]

  push:
    branches: [dev,main] # main branch which means staging env

    tags:
        - "[0-9]*.[0-9]*.[0-9]*" # tag branch which means production env
    paths:
      - "services/*"
      - ".github/workflow/*"

env:
  REGISTRY: docker.io
  DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.extract.outputs.services }}
      services_changed: ${{ steps.extract.outputs.services_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d #vv4.0.1
        with:
          list-files: shell
          filters: |
            services:
              - 'services/**'
            github:
              - '.github/**'

      - name: Extract services
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          SERVICES_FILES="${{ steps.filter.outputs.services_files }}"
          GITHUB_FILES="${{ steps.filter.outputs.github_files }}"

          if [ -n "$GITHUB_FILES" ]; then

            ALL_SERVICES=$(
              find services -mindepth 1 -maxdepth 1 -type d -printf "%f\n" \
                | jq -R -s -c 'split("\n") | map(select(length>0))'
            )

            SERVICES="$ALL_SERVICES"
            MODE="all"

          elif [ -n "$SERVICES_FILES" ]; then

            MODIFIED_SERVICES=$(
              echo "$SERVICES_FILES" \
                | tr ' ' '\n' \
                | cut -d'/' -f2 \
                | sort -u \
                | jq -R -s -c 'split("\n") | map(select(length>0))'
            )

            SERVICES="$MODIFIED_SERVICES"
            MODE="partial"

          else
            SERVICES="[]"
            MODE="none"
          fi

          if [ "$SERVICES" != "[]" ]; then
            echo "services_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "services_changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  unit-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.services_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    uses: ./.github/workflows/languages.yaml
    with:
      services: ${{ matrix.service }}

  sast-sonarqube:
    name: SonarQube SAST
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services_changed == 'true'

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: services/${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services_changed == 'true'
    strategy:
      fail-fast: false
      matrix: 
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        with:
          scan-path: services/${{ matrix.service }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

 
  dependency-scan:
    name: Dependency Scan (Trivy FS)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        
        with:
          scan-type: fs
          scan-ref: services/${{ matrix.service }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

  dockerfile-lint :
    name: " Dockerfile Lint"
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.services_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/${{ matrix.service }}/Dockerfile
          failure-threshold: error  
          # failure-threshold: warning  # or using "warning" to upgrade the dockerfile to its best quality"


  generate-image-tag:
    name: Generate image tag
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services_changed == 'true'
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Generate tag from git
        id: image_tag
        run: |
          IMAGE_TAG=$(git describe --tags --first-parent --match "[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || true)
          if [ -z "$IMAGE_TAG" ]; then
             IMAGE_TAG=${GITHUB_SHA::7}
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [generate-image-tag,detect-changes, unit-test,secret-scan,dependency-scan,dockerfile-lint]
    if: needs.detect-changes.outputs.services_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_TAG: ${{ needs.generate-image-tag.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  image-security-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [generate-image-tag,detect-changes, build-and-push]
    if: needs.detect-changes.outputs.services_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    env:
      IMAGE_TAG: ${{ needs.generate-image-tag.outputs.image_tag }}

    steps:
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0 
        with:
          image-ref: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          vuln-type: "os,library"
          ignore-unfixed: true
          timeout: "10m"

  sign-image:
    name: Sign Image (Cosign)
    runs-on: ubuntu-latest
    needs: [generate-image-tag,detect-changes,image-security-scan]
    if: needs.detect-changes.outputs.services_changed == 'true' && github.ref_name == 'main'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    env:
      IMAGE_TAG: ${{ needs.generate-image-tag.outputs.image_tag }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes docker.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Verify signature
        run: |
          cosign verify docker.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}

  update-development-image-tag:
    name: Update development image tag
    permissions:
          contents: write
          pull-requests: write
    needs:
      - generate-image-tag
      - detect-changes
      - image-security-scan

    if: |
      needs.detect-changes.outputs.services_changed == 'true' && 
      github.ref == 'refs/heads/dev' && 
      github.event_name == 'push'
    

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    uses: ./.github/workflows/update-images.yaml
    with:
      IMAGE_TAG: ${{ needs.generate-image-tag.outputs.image_tag }}
      IDENTIFIER_COMMENT: "DEV_IMAGE_TAG"
      STARTING_PATH: .
      SERVICES: ${{ matrix.service }}
      ENV: dev

    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}

      

  update-production-image-tag:
    name: Update production image tag

    needs:
      - generate-image-tag
      - detect-changes
      - image-security-scan
      - sign-image

    if: |
      needs.detect-changes.outputs.services_changed == 'true' &&
      startsWith(github.ref, 'refs/tags/') &&
      github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    uses: ./.github/workflows/update-images.yaml

    with:
      IMAGE_TAG: ${{ needs.generate-image-tag.outputs.image_tag }}
      IDENTIFIER_COMMENT: "PROD_IMAGE_TAG"
      STARTING_PATH: ${{ github.workspace }}
      SERVICES: ${{ matrix.service }}
      ENV: prod

    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}