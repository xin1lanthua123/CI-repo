name: CI pipeline
on: 
    workflow_dispatch:
      inputs:
        action:
            description: "Terraform action"
            required: true
            default: "apply"
            type: choice
            options:
            - apply
            - bootstrap
            - destroy
jobs:
    terraform-bootstrap:
        runs-on: ubuntu-latest
        if: github.event.inputs.action == 'bootstrap'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Install Terragrunt and OpenTofu
              uses: gruntwork-io/terragrunt-action@v3
              with:
                    tg_version: '0.82.2'
                    tofu_version: '1.10.1'

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Apply terraform bootstrap using terragrunt
              working-directory: infra/terragrunt/bootstrap/local
              run: |
                terragrunt apply --auto-approve -terragrunt-non-interactive
            - name: Migrate local state to remote state S3
              working-directory: infra/terragrunt/bootstrap/local
              run: |
                terragrunt init -migrate-state -force-copy -terragrunt-non-interactive  
    terraform-apply:
        runs-on: ubuntu-latest
        if: github.event.inputs.action == 'apply'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Install Terragrunt and OpenTofu
              uses: gruntwork-io/terragrunt-action@v3
              with:
                    tg_version: '0.82.2'
                    tofu_version: '1.10.1'

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ vars.AWS_REGION }}

            # - name: Plan terraform infra using terragrunt
            #   working-directory: infra/terragrunt/live/prod
            #   run: |
            #     terragrunt run-all plan --terragrunt-non-interactive

            - name: Apply terraform infra using terragrunt
              working-directory: infra/terragrunt/live/prod
              run: |
               
                terragrunt run-all apply -auto-approve --terragrunt-non-interactive
    terraform-destroy:
        runs-on: ubuntu-latest
        if: github.event.inputs.action == 'destroy'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Install Terragrunt and OpenTofu
              uses: gruntwork-io/terragrunt-action@v3
              with:
                    tg_version: '0.82.2'
                    tofu_version: '1.10.1'

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Apply terraform infra using terragrunt
              working-directory: infra/terragrunt/live/prod
              run: |
                terragrunt run-all destroy -auto-approve --terragrunt-non-interactive

            
