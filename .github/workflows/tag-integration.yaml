name: Reusable workflow - Image Tag Integration

on:
  workflow_call:
    inputs:
      services:
        description: "microservices status (e.g. changed)"
        required: true
        type: string
      IMAGE_TAG:
        description: "image_tag"
        required: true
        type: string

jobs:
  update-development-image-tag:
    name: Update development image tag
    runs-on: ubuntu-latest
    if: ${{ inputs.services == 'true' }}

    env:
      IMAGE_TAG: ${{ needs.generate-image-tag.outputs.image_tag }}
      STARTING_PATH: ${{ github.workspace }}
      IDENTIFIER_COMMENT: "# DEV_IMAGE_TAG"

    steps:
      - uses: actions/checkout@v4

      - name: Update YAML files (dev)
        run: |
          set -e

          if [ -z "$IMAGE_TAG" ]; then
            echo "IMAGE_TAG is required"
            exit 1
          fi


          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "STARTING_PATH=$STARTING_PATH"
          echo "IDENTIFIER_COMMENT=$IDENTIFIER_COMMENT"

          find "$STARTING_PATH" -type f \( -name "*.yaml" -o -name "*.yml" \) \
            -exec grep -l "$IDENTIFIER_COMMENT" {} \; | while read -r file; do
              if grep -Fxq "$file" ; then

                echo "Updating $file"

                sed -i "s|\(\s*image:\s*\).*${IDENTIFIER_COMMENT}|\1${IMAGE_TAG} ${IDENTIFIER_COMMENT}|g" "$file"
              fi
          done


  update-production-image-tag:
    name: Update production image tag
    runs-on: ubuntu-latest
    needs: [update-development-image-tag]
    if: ${{ inputs.services == 'true' && startsWith(github.ref, 'refs/tags/') }}

    env:
      IMAGE_TAG: ${{ needs.generate-image-tag.outputs.image_tag }}
      STARTING_PATH: ${{ github.workspace }}
      IDENTIFIER_COMMENT: "# PROD_IMAGE_TAG"

    steps:
      - uses: actions/checkout@v4

      - name: Update YAML files (prod)
        run: |
          set -e

          if [ -z "$IMAGE_TAG" ]; then
            echo "IMAGE_TAG is required"
            exit 1
          fi

          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "STARTING_PATH=$STARTING_PATH"
          echo "IDENTIFIER_COMMENT=$IDENTIFIER_COMMENT"

          find "$STARTING_PATH" -type f \( -name "*.yaml" -o -name "*.yml" \) \
            -exec grep -l "$IDENTIFIER_COMMENT" {} \; | while read -r file; do
             echo "Updating $file"

             sed -i "s|\(\s*image:\s*\).*${IDENTIFIER_COMMENT}|\1${IMAGE_TAG} ${IDENTIFIER_COMMENT}|g" "$file"
             
          done
