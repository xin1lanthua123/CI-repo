name: Update Image Multi Environment

on:
  workflow_call:
    inputs:
      ENV:
        description: "environment"
        required: true
        type: string
      IMAGE_TAG:
        description: "image tag"
        required: true
        type: string

      STARTING_PATH:
        description: "starting path"
        required: false
        type: string
        default: "."

      IDENTIFIER_COMMENT:
        description: "identifier comment"
        required: true
        type: string

      SERVICES:
        description: "service name"
        required: false
        type: string

    secrets:
      GITOPS_TOKEN:
        description: "GITOPS REPO TOKEN"
        required: true

permissions:
  contents: read
jobs:
  update-image:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: xin1lanthua123/CD-repo
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update YAML files
        shell: bash
        working-directory: gitops
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ inputs.IMAGE_TAG }}"
          STARTING_PATH="${{ inputs.STARTING_PATH }}"

          SERVICES="${{ inputs.SERVICES }}"
          SERVICE_MARKER="$(echo "$SERVICES" | tr '[:lower:]' '[:upper:]')"

          IMAGE_MARKER="${{ inputs.IDENTIFIER_COMMENT }}"

          

          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "STARTING_PATH=$STARTING_PATH"
          echo "SERVICE_MARKER=$SERVICE_MARKER"
          echo "IMAGE_MARKER=$IMAGE_MARKER"


          find "$STARTING_PATH" -type f \( -name "*.yaml" -o -name "*.yml" \) \
            -exec grep -l "$IMAGE_MARKER" {} \; | while read -r file; do

              echo "Processing $file"
              if ! grep -q "$IMAGE_MARKER" "$file" ;then
                  echo "Skipping (no image marker)"
                  continue
              fi

              if ! grep -q "$SERVICE_MARKER" "$file" ;then
                  echo "Skipping (no service marker)"
                  continue
              fi
              echo "Updating service file: $file"

              # Pattern 1:
              # image: nginx:1.0.0 # DEV_IMAGE_TAG (used for Kubernetes manifest)
                  sed -E -i \
                  "s|(image:\s*[^:]+:)[^[:space:]]+|\1${IMAGE_TAG}|g" \
                  "$file"
                              
              
              # Pattern 2:
              # tag: nginx:1.0.0 # DEV_IMAGE_TAG (used for HELM manifest )
                  sed -E -i \
                  "s|(tag:\s*)[^[:space:]]+|\1${IMAGE_TAG}|g" \
                  "$file"

              echo "$file updated"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          branch: ci/feature/${{ inputs.SERVICES }}-${{ inputs.ENV }}-${{ inputs.IMAGE_TAG }}
          base: main
          title: "Promote ${{ inputs.SERVICES }} -> ${{ inputs.IMAGE_TAG }}"
          delete-branch: true
          commit-message: |
            chore(${{
              inputs.ENV
            }}): update ${{ inputs.SERVICES }} image -> ${{ inputs.IMAGE_TAG }}
          body: |
            Generated by CI repo

            Service: ${{ inputs.SERVICES }}
            Image: ${{ inputs.IMAGE_TAG }}
            Env: ${{ inputs.ENV }}

      - name: Auto merge for DEV environment
        shell: bash
        if: inputs.ENV == 'dev' || inputs.ENV == 'prod'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          gh pr merge \
            "ci/feature/${{ inputs.SERVICES }}-${{ inputs.ENV }}-${{ inputs.IMAGE_TAG }}" \
            --repo xin1lanthua123/CD-repo \
            --auto --squash
      
          
      